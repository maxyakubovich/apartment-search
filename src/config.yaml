# SF Apartment Watcher — tuning knobs.
# Everything the matching logic depends on lives here. Expect to adjust the
# ladder after a few days of real traffic.

search:
  # Only alerts belonging to these saved searches are processed. Each id comes
  # from `savedSearchEnrollmentId` in that search's URL, and is cross-checked
  # against the `encodedEnrollmentId` in every alert's unsubscribe link.
  # Matching on the id rather than the display name ("SF 750-1k sqft") means
  # renaming a search in Zillow will not silently break the watcher.
  #
  # Deliberately just the one search. The separate >1,000 sqft alerts are
  # triaged by hand — those listings are big enough that the den question is
  # easy to eyeball, whereas 750-1,000 sqft is exactly the band where it takes
  # real scrutiny. Adding that search's id here would only add noise.
  #
  # Alerts from other searches still arrive in the mailbox and are read, then
  # discarded at this check. That costs nothing: parsing happens before any
  # Apify or Claude call.
  saved_search_enrollment_ids:
    - X1-SS5o5te731uya10000000000_5f90w # "SF 750-1k sqft"

  # Hard gates. A listing failing any of these is dropped before it costs
  # anything — no Apify fetch, no Claude call.
  max_rent: 6500
  allowed_beds: [1, 2]
  min_sqft_floor: 850 # absolute floor; below this nothing is ever notified

  # Optional geo filter, as [lng, lat] pairs. Left null deliberately: the saved
  # search uses a drawn custom region (customRegionId), whose shape is not
  # recoverable from the URL — only its bounding box is. Zillow already applies
  # the real boundary before sending the email, so a second check here would
  # add nothing but a chance to wrongly exclude something.
  polygon: null

# Den confidence sets the square-footage bar rather than acting as a hard gate:
# a confirmed den earns a lower bar, an unclear listing has to be big enough to
# carve out a private corner. Evaluated top to bottom; first match wins.
ladder:
  - name: two_bedroom
    # A second bedroom is the office. Still gets a layout sanity check.
    when: { beds: 2, min_sqft: 900 }
  - name: confident_den
    when: { min_den_conf: 0.6, min_sqft: 850 }
  - name: plausible_den
    when: { min_den_conf: 0.3, min_sqft: 900 }
  - name: labeled_den
    # A floor plan that literally labels a room DEN is worth seeing even when
    # it fails the door test — an entry den with no door may still be workable
    # with a curtain or a screen, and that is a judgement call to make by eye
    # rather than one to suppress. The message says plainly what fell short.
    when: { den_labeled: true, min_sqft: 850 }
  - name: room_to_sequester
    # No den signal, but large enough to wall off a desk. Withdrawn when the
    # unit is affirmatively open-plan, where floor area buys no privacy.
    when: { min_den_conf: 0.0, min_sqft: 1000, not_open_plan: true }

# Square footage is frequently absent on SF landlord-posted rentals. Treat it as
# unknown rather than zero: only notify on a confident den, and tag the message.
missing_sqft:
  min_den_conf: 0.6

den:
  # Stage 1 is text-only and free of image cost. These terms push confidence up;
  # the model still makes the call, they are not a hard keyword match.
  positive_terms:
    - den
    - office
    - flex
    - flex space
    - bonus room
    - study
    - nook
    - alcove
    - junior 2 bedroom
    - jr 2 bedroom
    - 1br+
    - "1 bed + "
    - sunroom
    - bonus space
    - extra room
  # Only consulted when no floor plan is available. If a plan exists the vision
  # pass always runs, because a low text score usually means the description
  # never described the layout rather than that there is no room.
  escalate_band: [0.15, 0.85]
  max_photos: 6

models:
  text: claude-sonnet-5
  vision: claude-sonnet-5

runtime:
  poll_seconds: 120
  # Stop the self-looping job short of the 6h Actions ceiling so it has time to
  # re-dispatch itself cleanly.
  max_loop_seconds: 21000 # 5h50m
  imap_lookback_hours: 48
