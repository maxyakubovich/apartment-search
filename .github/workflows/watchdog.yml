name: watchdog

# Insurance for the self-dispatch chain in watch.yml. If a run is cancelled, a
# runner is reclaimed, or the redispatch curl fails, nothing would ever restart
# the loop and the watcher would go silent without any error. This checks every
# half hour and starts a loop when none is running.
#
# Cron lateness does not matter here — being 20 minutes slow to notice a dead
# chain is fine, which is exactly why the fast path does not use cron.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ensure-running:
    runs-on: ubuntu-latest
    steps:
      - name: Start the watch loop if it is not running
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          count=$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/watch.yml/runs?per_page=100" \
            | python3 -c "
          import json, sys
          runs = json.load(sys.stdin).get('workflow_runs', [])
          live = [r for r in runs if r['status'] in ('queued', 'in_progress', 'waiting')]
          print(len(live))
          ")

          if [ "$count" -gt 0 ]; then
            echo "watch loop is alive ($count active run(s)) — nothing to do."
            exit 0
          fi

          echo "No active watch run found. Starting one."
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/watch.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
